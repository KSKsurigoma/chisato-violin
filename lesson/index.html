<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lesson | Chisato Violin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --primary-color: #2c2c2c;
      --accent-color: #b8860b;
      --bg-light: #faf9f7;
      --text-color: #333333;
      --text-light: #666666;
    }
    body {
      font-family: 'Noto Sans JP', sans-serif;
      color: var(--text-color);
      line-height: 1.8;
      background: var(--bg-light);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .card {
      max-width: 640px;
      background: #fff;
      padding: 3rem;
      border-radius: 4px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.06);
      text-align: center;
    }
    .eyebrow {
      font-family: 'Cormorant Garamond', serif;
      letter-spacing: 0.2em;
      color: var(--accent-color);
      text-transform: uppercase;
      font-size: 0.9rem;
    }
    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.4rem;
      font-weight: 500;
      margin: 0.5rem 0 1rem;
      color: var(--primary-color);
    }
    .badge {
      display: inline-block;
      background: var(--bg-light);
      border: 1px solid rgba(184,134,11,0.3);
      color: var(--accent-color);
      padding: 0.3rem 0.9rem;
      border-radius: 999px;
      font-size: 0.85rem;
      margin: 1rem 0 1.5rem;
    }
    p { color: var(--text-light); }
    .nav { margin-top: 2rem; display: flex; gap: 0.8rem; flex-wrap: wrap; justify-content: center; }
    .nav a {
      text-decoration: none;
      color: var(--primary-color);
      border: 1px solid rgba(0,0,0,0.12);
      padding: 0.6rem 1.2rem;
      border-radius: 4px;
      font-size: 0.9rem;
      transition: all .2s;
    }
    .nav a:hover { border-color: var(--accent-color); color: var(--accent-color); }
  </style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">Pattern B</div>
    <h1>Lesson</h1>
    <div class="badge">フォルダ + index.html → <code>/lesson/</code></div>
    <p>これは <code>lesson/</code> フォルダの中に <code>index.html</code> を置いたパターン。<br>
       <code>.html</code> を付けず <strong>フォルダ名だけ</strong>でアクセスできるから、URLがキレイになるのが利点やで。</p>
    <div class="nav">
      <a href="../">← トップへ</a>
      <a href="../about.html">Aboutページ (Pattern A)</a>
      <a href="../pages/test.html">テストページ (Pattern C)</a>
    </div>
  </div>
</body>
</html>
